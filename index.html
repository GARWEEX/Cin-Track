<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinéTrack - Movies</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-full font-sans">

  <header class="w-full border-b border-slate-900 bg-slate-950/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3">
        <span class="text-sm font-extrabold tracking-wider text-white uppercase">
          Ciné<span class="text-red-600">Track</span>
        </span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium text-slate-300">
        <a href="#" class="text-white hover:text-red-500 transition-colors">Movies</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex gap-6 min-h-screen">
    
    <div class="flex-1">
      <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 flex flex-col sm:flex-row gap-3">
        <label class="sr-only" for="searchFilm">Rechercher un film</label>
        <input id="searchFilm" type="search" placeholder="Rechercher un film..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-600">
        
        <label class="sr-only" for="genreFilter">Genre</label>
        <select id="genreFilter" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-red-600">
          <option value="all">Tous</option>
          <option value="films">Films</option>
          <option value="series">Séries</option>
        </select>
      </section>

           <div id="moviesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div> 

    <aside class="w-full md:w-1/4 min-h-full bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col">
      <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-800 pb-2 flex items-center justify-between">
        <span>Favorites</span>
        <span id="favCount" class="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full">0</span>
      </h2>
      
      <div id="favoritesList" class="flex-grow text-sm text-slate-400 space-y-3">
        <p class="text-xs text-slate-500 text-center py-4">No favorites added yet.</p>
      </div>
    </aside>

  </main> 

  <footer class="border-t border-slate-900 bg-slate-950 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-slate-500">
      <span class="text-sm font-extrabold tracking-wider text-white uppercase">
        Ciné<span class="text-red-600">Track</span>
      </span>
      <p>&copy; 2026 CinéTrack. All rights reserved.</p>
      <div class="flex gap-6">
        <a href="#" class="hover:text-slate-400 transition-colors">Movies</a>
        <a href="#" class="hover:text-slate-400 transition-colors">Privacy</a>
      </div>
    </div>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
